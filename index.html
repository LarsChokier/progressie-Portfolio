<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lars · Festival for a cause · Process portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="wrap"><b id="navName">Portfolio</b>
<a href="#concept">Concept</a><a href="#cause">Cause</a><a href="#persona">Persona</a><a href="#empathy">Empathy map</a><a href="#journey">Journey</a><a href="#research" id="navResearch">Research</a><a href="#log">Process</a></div></nav>

<header class="hero" id="hero">
  <div class="layer dim" aria-hidden="true"><div class="wrap"><h1 id="titleDim"></h1><p class="sub" id="subDim"></p></div></div>
  <div class="layer lit"><div class="wrap">
    <h1 id="titleLit"></h1>
    <p class="sub" id="subtitle"></p>
  </div></div>
  <div class="glow"></div>
  <div class="stal-top" aria-hidden="true"></div>
  <div class="hint">Move your light around</div>
</header>
<div class="stal-bottom" aria-hidden="true"></div>

<main class="wrap">
  <section id="concept">
    <h2>The concept</h2>
    <p class="lead" id="conceptLead"></p>
    <div class="grid2" id="conceptGrid"></div>
  </section>

  <section id="cause">
    <h2>The cause</h2>
    <p class="lead" id="causeLead"></p>
    <div id="causeBox"></div>
  </section>

  <section id="persona">
    <h2>The persona</h2>
    <p class="lead" id="personaLead"></p>
    <div id="personaBox"></div>
  </section>

  <section id="empathy">
    <h2>Empathy map</h2>
    <p class="lead" id="empathyLead"></p>
    <div class="grid2" id="empathyGrid"></div>
  </section>

  <section id="journey">
    <h2>Journey</h2>
    <p class="lead" id="journeyLead"></p>
    <div class="journey" id="journeyGrid"></div>
  </section>

  <section id="research">
    <h2>Research</h2>
    <p class="lead" id="researchLead"></p>
    <div class="scroll"><table id="researchTable"></table></div>
  </section>

  <section id="log">
    <h2>Process</h2>
    <p class="lead" id="logLead"></p>
    <div id="logList"></div>
  </section>
</main>

<div class="exit" aria-hidden="true">
  <svg viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
    <circle cx="880" cy="190" r="62" fill="#fff1b8" opacity=".95"/>
    <circle cx="880" cy="190" r="110" fill="#fff1b8" opacity=".18"/>
    <path d="M0 260 V190 C140 150 260 170 380 198 C520 230 640 170 780 190 C920 212 1060 160 1200 190 V260 Z" fill="#2f5a40"/>
    <path d="M0 260 V222 C160 196 300 232 470 222 C640 212 760 238 940 224 C1060 214 1140 226 1200 220 V260 Z" fill="#14281e"/>
  </svg>
</div>
<footer>
  <div class="wrap">
    <div id="sourceBox"><h3>Sources</h3><ul id="sourceList"></ul></div>
    <p style="margin-top:28px" id="footName"></p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
